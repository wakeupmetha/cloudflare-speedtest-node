# One agent per VPN node. Drop this next to the node's existing compose,
# put PANEL_URL + TOKEN (from the panel's /nodes page) in `.env`, and:
#
#   docker compose up -d
#
# Then `docker compose logs -f` and look for:
#
#   INFO   panel       paired as "<node name>"
#
# The panel is the only consumer and the agent CONNECTS OUT to it, so there
# is no port to publish and no firewall rule to add. The local API on 9101
# is loopback-only inside the container (healthcheck + debugging); publish
# it with `ports:` and BIND=0.0.0.0 only if you want to curl it from the host.

services:
  agent:
    container_name: aerio-agent
    image: ghcr.io/wakeupmetha/cloudflare-speedtest-node:latest
    # `docker compose build` builds locally under the same tag; `up` uses
    # whichever image is present.
    build: .
    restart: unless-stopped
    environment:
      # Where the panel lives. Empty = standalone (local API only).
      PANEL_URL: ${PANEL_URL:-}
      # The secret the panel minted for THIS node. Required.
      TOKEN: ${TOKEN}
      # Speedtest cadence (30 min) and its ±jitter.
      INTERVAL_MS: ${INTERVAL_MS:-1800000}
      JITTER_PCT: ${JITTER_PCT:-0.15}
      # Service-availability checks via geocheck (6 h; 0 disables).
      GEOCHECK_INTERVAL_MS: ${GEOCHECK_INTERVAL_MS:-21600000}
      # Measurement knobs — see .env.example.
      CONCURRENCY: ${CONCURRENCY:-4}
      DOWNLOAD_SEC: ${DOWNLOAD_SEC:-5}
      UPLOAD_SEC: ${UPLOAD_SEC:-5}
      MAX_HISTORY: ${MAX_HISTORY:-1500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - agent-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  agent-data:
